apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: booking-service
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - booking-gateway
  http:
    - name: feature-flag
      match:
        - headers:
            x-istio-feature:
              exact: v2
      route:
        - destination:
            host: booking-service
            subset: v2
      retries:
        attempts: 3
        perTryTimeout: 1s
    - name: canary
      route:
        - destination:
            host: booking-service
            subset: v1
          weight: 90
        - destination:
            host: booking-service
            subset: v2
          weight: 10
      retries:
        attempts: 3
        perTryTimeout: 1s
        retryOn: 5xx,reset,connect-failure
