replicaCount: 2

appLabel: booking-service
version: v1

image:
  name: booking-service
  tag: v1
  pullPolicy: Never

service:
  create: true
  name: booking-service
  type: ClusterIP
  httpPort: 80
  httpTargetPort: 8080
  grpcPort: 5555
  grpcTargetPort: 5555

ENABLE_FEATURE_X: false
PING_VERSION: ""

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Development"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  path: /ping
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  path: /ping
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1
